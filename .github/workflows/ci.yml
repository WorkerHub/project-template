name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # 版本号由 web 构建脚本从 git describe 生成；浅克隆拿不到 tag，故取全历史。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # 改名残留检查（规格 §4）：白名单外出现项目名/slug 令牌即失败。
      - name: Identity tokens
        run: pnpm check:identity

      # 部署配置能否解析、Worker 能否打包；--dry-run 不联网、不写任何线上资源。
      - name: Check deploy config
        run: pnpm check:deploy
